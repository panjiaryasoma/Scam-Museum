[project]
name = "scam-museum"
version = "0.1.0"
description = "An AI-powered museum of digital deception."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "scikit-learn==1.9.0",
  "numpy==2.3.2",
  "scipy==1.17.0",
  "joblib==1.5.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires frozen local v0.5 model artifacts",
]
filterwarnings = [
  'ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\..*:DeprecationWarning:joblib\.numpy_pickle',
  'ignore:Using .httpx. with .starlette\.testclient. is deprecated.*:Warning:fastapi\.testclient',
]
